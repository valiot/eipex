services:
  cpppo:
    image: python:3.11-slim
    command: >
      sh -c "pip install --quiet cpppo &&
             python -m cpppo.server.enip --address 0.0.0.0:44818 -v SCADA=INT[1000]"
    ports:
      - "44818:44818"

  opener:
    build: ./opener
    network_mode: host
    command: ["./src/ports/POSIX/OpENer", "lo"]
